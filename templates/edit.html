<!DOCTYPE html>
<html>

<head>
    <title>Edit Medicine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>✏️ Edit Medicine</h1>

        <form method="POST" class="medicine-form">

            <input type="text" name="name" value="{{ medicine[1] }}" placeholder="Medicine Name" required>

            <input type="number" name="quantity" value="{{ medicine[2] }}" placeholder="Quantity" required>

            <input type="number" step="0.01" name="price" value="{{ medicine[3] }}" placeholder="Price" required>

            <input type="date" name="expiry" value="{{ medicine[4] }}" required>

            <button type="submit" class="btn-edit">
                Update Medicine
            </button>

        </form>

        <a href="/" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
